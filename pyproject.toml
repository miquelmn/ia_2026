[project]
name = "ia2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "notebook>=7.4.7",
    "scipy>=1.16.2",
    "tqdm>=4.67.1",
    "typer>=0.16.0",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "pygame-ce>=2.5.8",
    "ialib",
    "pipreqs>=0.5.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
run-task = "runner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/runner"]

[tool.uv]
package = true

[tool.uv.sources]
ialib = { git = "https://github.com/miquelmn/iaLib" }

